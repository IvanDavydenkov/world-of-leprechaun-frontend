schema: spec-driven

context: |
  Название проекта в интерфейсе: «Мир лепреконов» (на русском языке).
  Управление VPN-серверами доступно admin через кнопку «Серверы» в шапке и модалку:
  GET списка/записи, POST создания, PATCH с expected_revision. Пароль не помещать
  в Redux actions/state/storage; очищать при закрытии и завершении сохранения.
  Базовый реестр работает на старом backend. По целевому контракту vpn-server-migration
  от 2026-11-02 frontend подготовлен для prepare/resume/switch/revoke/retry и операций.
  Новые API backend ещё не реализованы: проверять routing/features, при 404 блокировать
  новые действия без мок-успеха и сохранять legacy CRUD. Switch сохраняет старые выдачи,
  отзыв — только отдельным явным подтверждением. Возврат может использовать reused.
  Безопасное намерение key/payload/operation_id хранится отдельно для actor в sessionStorage,
  очищается при logout/смене actor; пароль туда и в Redux не помещать. 202 — не успех.
  Проект: личный кабинет пользователя VPN. Целевой домен: worldofleprechauns.ru.
  Основная цель: дать пользователю доступ к своим VPN-конфигурациям и их загрузке.
  Область проекта: frontend; серверная реализация и управление VPN-инфраструктурой
  не входят в текущий объём. Домен не означает выполненную настройку DNS или деплоя.

  Целевой стек:
  - React и TypeScript; функциональные компоненты.
  - Redux Toolkit и React Redux для общего клиентского состояния.
  - RTK Query для запросов, мутаций, кеширования и серверного состояния.
  - React Router (react-router-dom) для маршрутизации.
  - Zod для валидации форм; ошибки схем и сервера отображаются пользователю.
  - Material UI (@mui/material), реализующий Material Design, для UI и темизации.
  - Vite для сборки и разработки, Vitest для тестов; React Testing Library для UI.
  Зависимости установлены; приложение переведено с CRA на Vite/Vitest.
  Подключены Redux Provider, фирменная тема MUI и маршрут `/` с каркасом кабинета.
  Шапка обычного пользователя не содержит навигации или бургера; выход доступен
  прямо в шапке на телефоне и desktop. Меню дополнительных страниц — только для
  admin (личный кабинет, пользователи). Якорные пункты разделов страницы не добавлять.
  Авторизация: GET /me, POST /auth/logout через хуки RTK Query;
  профиль проверяется Zod. Вход через переход на GET /auth/yandex/login.
  Все API-запросы UI MUST выполняться через хуки RTK Query, без прямого fetch/axios
  или сетевых вызовов в useEffect. OAuth-навигация — отдельный браузерный поток.
  /auth/yandex/callback обрабатывает backend; proxy возвращает успех в кабинет,
  а ошибки — на /login?auth_error=1. Сессия хранится только в HttpOnly-cookie.
  Отказ и прерывание OAuth не считаются успехом. 401 ведёт на вход; ошибки сети/5xx
  показывают сообщение и повторную попытку. Парольных форм нет.
  Admin управляет конфигами из modal в таблице пользователей: добавление 1..20,
  отзыв одного/выбранных/всех через users API. Все изменения требуют Idempotency-Key,
  после HTTP 202 проверяется config-operations; принятие не равно успеху.
  При повторе неизвестного/partial/failed результата сохранять payload и ключ;
  подтверждать отзыв в UI, обновлять каталог по серверному статусу.
  Личный кабинет на / использует GET /me/configs и /me/configs/{id}/download по
  контракту backend user-config-download. Владельца задаёт только серверная сессия,
  frontend не передаёт owner_id. Blob скачивания не хранить в Redux, логах или
  persistent storage. DTO и маршруты сверены с реализованным backend; реальные
  данные не подменять моками. Тестовые фикстуры используются только при проверках.

  Развёртывание: многоэтапная Docker-сборка (Node.js 24 -> Nginx),
  запуск через docker compose up -d --build. Файл сборки называется dockerfile
  в нижнем регистре и явно указан в compose.yaml. Nginx раздаёт dist и поддерживает
  SPA fallback; Внутренний HTTP-порт контейнера 80, хост 127.0.0.1:8082 за Nginx. DNS и HTTPS настраиваются отдельно.
  Docker frontend подключается к внешней сети BACKEND_NETWORK, users API задаётся
  USERS_API_ORIGIN (по умолчанию http://users:8080). В Vite по умолчанию 127.0.0.1:8080.
  Production: VITE_API_ORIGIN=https://api.worldofleprechauns.ru, credentials=include; OAuth callback на API, CORS разрешает только origin frontend. Локально Vite proxy сохраняется.
  Не монтировать исходники и не запускать Vite dev server в production.

  Архитектура: Feature-Sliced Design (FSD).
  - Слои src/app, src/pages, src/widgets, src/features, src/entities, src/shared.
    Создавать только необходимые слои и слайсы; слой processes не использовать.
  - Зависимости направлены вниз: app -> pages -> widgets -> features -> entities -> shared.
    Слайсы одного слоя не импортируют друг друга; циклические зависимости запрещены.
  - Доступ к слайсу извне через его публичный API (index.ts), без deep imports.
  - Сегменты ui, model, api, lib, config добавляются по необходимости.
    shared содержит переиспользуемый код без бизнес-логики конкретных features/entities.
  - app собирает провайдеры, store, router и тему; бизнес-логику размещать в слайсах.
  - RTK Query base API и транспорт размещать в shared/api; доменные endpoints —
    в соответствующих слайсах через injectEndpoints. Не дублировать кеш API в Redux slices.
  - Локальное состояние интерфейса оставлять в компонентах, если оно не нужно глобально.

  Именование файлов и папок:
  - Все создаваемые файлы и папки проекта MUST использовать kebab-case:
    строчные латинские буквы, цифры и дефисы между словами.
    Примеры: home-page.tsx, app-providers.tsx, user-profile/.
  - PascalCase и camelCase в путях запрещены, в том числе для React-компонентов.
    Суффиксы разделяются точками (app.test.tsx, vite.config.ts).
  - Исключения — стандартные имена инструментов и соглашений (AGENTS.md,
    README.md, SKILL.md), dotfiles, сторонние и генерируемые файлы.
  - Импорты и ссылки MUST точно совпадать с именами файлов, включая регистр.
    Правило не меняет соглашения об именах компонентов и идентификаторов в коде.

  Визуальные правила:
  - Использовать локально подключённый Roboto, включая кириллицу.
  - Скругление основных карточек — 12px.
  - Подписи и размеры кнопок сохранять при загрузке; кнопка скачивания имеет
    текст «Скачать» и стабильную ширину независимо от сообщений о результате.

  Адаптивность и приоритет устройств:
  - Интерфейс MUST разрабатываться по принципу mobile-first: сначала для мобильных
    телефонов, затем адаптироваться для планшетов и компьютеров.
  - На desktop интерфейс MUST оставаться удобным и визуально аккуратным:
    адаптировать сетку, отступы и ширину контента к доступному пространству.
  - Использовать responsive-возможности MUI и breakpoints темы; базовые стили
    задавать для мобильных экранов, расширения — для более широких.
  - Обеспечивать читаемость, удобные области нажатия и отсутствие горизонтального
    скролла страницы. Основные действия должны быть доступны на всех размерах экрана.
  - При изменении UI проверять отображение и взаимодействия на мобильном и desktop-размерах.

  Ограничения поведения и безопасности:
  - Доступ к личным конфигам требует авторизации; права проверяет сервер.
    Защита маршрута на клиенте служит только для UX и не заменяет серверную проверку.
  - Не хранить VPN-конфиги, приватные ключи и токены в репозитории, логах или
    постоянном браузерном хранилище. Не включать секреты в frontend env-переменные.
  - Предусматривать состояния загрузки, пустого результата, ошибки и отказа в доступе.
  - Zod-ошибки полей показывать у полей; общие и серверные ошибки — понятным сообщением.
  - Не придумывать API endpoints, DTO, механизм авторизации или форматы конфигов.
    Неизвестные контракты фиксировать как открытые вопросы; моки явно обозначать.
  - Админ-каталог пользователей разрешён: /admin/users-list использует GET /admin/users
    с limit/after, показывает id/display_name/role и доступен только роли admin.
    Сервер проверяет доступ; frontend скрывает пункт и закрывает прямой маршрут user.
    Опциональный vpn из чернового backend admin-user-overview подготовлен на frontend:
    counts/configs/traffic, freshness/coverage и подробности пользователя. Backend
    реализуется отдельно; отсутствие статистики не заменять нулями и не объявлять
    интеграцию с расширенным API завершённой до проверки итогового контракта.
  - Биллинг, прочие admin-возможности и управление серверами не включены без отдельного требования.

  Проверка изменений: Vitest для логики и React Testing Library для поведения UI.
  Проверять пользовательские сценарии, валидацию, обработку ошибок и загрузку конфигов;
  сетевые вызовы изолировать, реальные пользовательские секреты в тестах не использовать.
  Рабочий язык требований, обсуждений и OpenSpec-артефактов: русский.

rules:
  proposal:
    - Описывать цель пользователя, границы изменения и то, что не входит в объём.
    - Отделять существующее поведение от планируемого; перечислять неизвестные API-контракты.
  design:
    - Для изменений UI описывать мобильную компоновку в первую очередь и её адаптацию для desktop.
    - Все предлагаемые имена файлов и папок должны соответствовать kebab-case с исключениями из context.
    - Указывать затронутые FSD-слои, слайсы, публичные API и направление зависимостей.
    - Описывать владение состоянием, RTK Query, Zod-валидацию и состояния ошибок, если применимо.
    - Не подменять неизвестные серверные контракты предположениями.
  specs:
    - Для изменений UI включать применимые сценарии использования на мобильных и desktop-экранах.
    - Использовать нормативные SHALL/MUST и сценарии GIVEN/WHEN/THEN, текст писать по-русски.
    - Для сетевых пользовательских сценариев описывать успешный и применимые ошибочные исходы.
  tasks:
    - Для изменений UI включать проверку мобильного и desktop-отображения и взаимодействий.
    - При создании и переименовании файлов соблюдать kebab-case и обновлять импорты и ссылки.
    - Разделять настройку инструментов, реализацию и проверку на конкретные проверяемые задачи.
    - Включать релевантные тесты Vitest, проверку TypeScript и production-сборку для изменений кода.
    - Для документационных изменений достаточно проверки OpenSpec; не требовать тестов приложения.
